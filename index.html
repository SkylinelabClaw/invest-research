<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投研分析报告汇总</title>
    <style>
        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #0f3460;
            --highlight: #e94560;
            --text: #eaeaea;
            --text-muted: #a0a0a0;
            --card-bg: #1f2937;
            --border: #374151;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--primary);
            color: var(--text);
            line-height: 1.6;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
        header {
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            padding: 60px 0;
            margin-bottom: 40px;
            border-radius: 20px;
            text-align: center;
        }
        h1 { font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { color: var(--text-muted); font-size: 1.2em; }
        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }
        .report-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .report-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-color: var(--accent);
        }
        .report-icon { font-size: 3em; margin-bottom: 15px; }
        .report-title { font-size: 1.4em; font-weight: 700; margin-bottom: 10px; }
        .report-desc { color: var(--text-muted); font-size: 0.95em; margin-bottom: 15px; }
        .report-date { color: var(--accent); font-size: 0.85em; }
        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
            margin-right: 8px;
        }
        .tag-buy { background: rgba(0, 200, 83, 0.2); color: #00c853; }
        .tag-watch { background: rgba(255, 152, 0, 0.2); color: #ff9800; }
        footer { text-align: center; padding: 40px; color: var(--text-muted); font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 投研分析报告</h1>
            <p class="subtitle">Investment Research Reports | 公司投资分析汇总</p>
        </header>
        
        <div class="reports-grid">
            <a href="tencent.html" class="report-card">
                <div class="report-icon">🐧</div>
                <div class="report-title">腾讯控股 (00700.HK)</div>
                <p class="report-desc">2025年全年财报深度分析。营收7518亿，净利润2248亿，AI驱动增长，游戏业务强劲复苏。</p>
                <span class="tag tag-buy">买入</span>
                <span class="report-date">2026-03-20</span>
            </a>
            
            <a href="index.html" class="report-card">
                <div class="report-icon">🎵</div>
                <div class="report-title">腾讯音乐 (TME)</div>
                <p class="report-desc">Q4 2025 财报分析。在线音乐订阅增长稳健，但MAU下滑和停止披露运营指标引发市场担忧。</p>
                <span class="tag tag-watch">观察</span>
                <span class="report-date">2026-03-20</span>
            </a>
        </div>
        
        <footer>
            <p>© 2026 投研分析报告 | 本报告仅供研究参考，不构成投资建议</p>
        </footer>
    </div>
</body>
</html>
